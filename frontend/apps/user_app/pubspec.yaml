name: user_app
description: Taskly User App - For Recruiters and Employers
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  google_sign_in: ^6.2.0
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10
  provider: ^6.1.0
  http: ^1.1.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.0.0
  equatable: ^2.0.5
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.1
  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/